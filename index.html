<script>

// --- DOM ---
const el = id => document.getElementById(id);

const playerSelect = el("playerSelect");
const planning = el("planning");
const rankingDay = el("rankingDay");
const rankingTotal = el("rankingTotal");
const clock = el("clock");
const countdown = el("countdown");
const clockCard = el("clockCard");
const meteo = el("meteo");

const prenom = el("prenom");
const pseudo = el("pseudo");
const indexInput = el("index");
const heure = el("heure");
const jour = el("jour");
const jourScore = el("jourScore");
const score = el("score");

// --- DATA ---
let players = JSON.parse(localStorage.players || "[]");
let tees = JSON.parse(localStorage.tees || "[]");
let scores = JSON.parse(localStorage.scores || "{}");

let activeId = null;

// ✅ COMPÉTITION
const competitions = {
  "Jour 1":"Lundi 3 août 2026 - YNOVIT (Simple)",
  "Jour 2":"Mardi 4 août 2026 - LA MONTAGNE (Scramble)",
  "Jour 3":"Mercredi 5 août 2026 - PARTOUCHE (Simple)"
};

// INIT joueurs
if(players.length === 0){
    players = [
        {id:1, prenom:"Louis", pseudo:"Luigi di Vichy", index:12},
        {id:2, prenom:"Yoyo", pseudo:"La Scalopina", index:10},
        {id:3, prenom:"Guigui", pseudo:"Comono", index:15},
        {id:4, prenom:"Marie", pseudo:"Pankake", index:18}
    ];
    save();
}

// SAVE
function save(){
    localStorage.players = JSON.stringify(players);
    localStorage.tees = JSON.stringify(tees);
    localStorage.scores = JSON.stringify(scores);
}

// ✅ JOUEURS
function renderPlayers(){
    playerSelect.innerHTML = "";

    players.forEach(p=>{
        playerSelect.innerHTML += `
        <option value="${p.id}">
        ${p.prenom} (${p.pseudo}) - HCP ${p.index}
        </option>`;
    });

    activeId = players[0].id;
    playerSelect.value = activeId;
}

playerSelect.onchange = () => activeId = Number(playerSelect.value);

// ✅ AJOUT JOUEUR
el("btnAddPlayer").onclick = () => {
    if(!prenom.value || !pseudo.value || !indexInput.value) return;

    players.push({
        id: Date.now(),
        prenom: prenom.value,
        pseudo: pseudo.value,
        index: Number(indexInput.value)
    });

    prenom.value="";
    pseudo.value="";
    indexInput.value="";

    save();
    renderPlayers();
};

// ✅ AJOUT DEPART (corrigé)
el("btnAddTee").onclick = () => {

    if(!heure.value || !heure.value.includes(":")) {
        alert("Format heure 09:10");
        return;
    }

    // 1 départ / joueur / jour
    tees = tees.filter(t => !(t.player === activeId && t.jour === jour.value));

    tees.push({
        jour: jour.value,
        heure: heure.value,
        player: activeId
    });

    heure.value="";
    save();
    renderPlanning();
};

// ✅ PLANNING PAR JOUR (clair)
function renderPlanning(){

    planning.innerHTML="";

    Object.keys(competitions).forEach(jourKey=>{

        planning.innerHTML += `<li><b>${competitions[jourKey]}</b></li>`;

        let list = tees
        .filter(t=>t.jour === jourKey)
        .sort((a,b)=>a.heure.localeCompare(b.heure));

        list.forEach(t=>{
            let p = players.find(x=>x.id===t.player);

            planning.innerHTML += `
            <li>
            ${t.heure} - ${p.prenom}
            </li>`;
        });

    });
}

// ✅ SCORE
el("btnAddScore").onclick = () => {

    let p = players.find(x=>x.id==playerSelect.value);
    if(!p || !score.value) return;

    let brut = Number(score.value);
    let net = brut - p.index;

    if(!scores[jourScore.value]) scores[jourScore.value]={};

    scores[jourScore.value][p.id]={brut, net};

    score.value="";
    save();
    renderRanking();
};

// ✅ CLASSEMENT
function renderRanking(){

    // JOUR
    rankingDay.innerHTML="";
    let dayScores = scores[jourScore.value] || {};

    let list = Object.entries(dayScores).map(([id,v])=>{
        let p = players.find(x=>x.id==id);
        return {nom:p.prenom,net:v.net};
    });

    list.sort((a,b)=>a.net-b.net);

    list.forEach((l,i)=>{
        rankingDay.innerHTML += `<li>#${i+1} ${l.nom} ${l.net}</li>`;
    });

    // GLOBAL
    let total = {};

    Object.values(scores).forEach(day=>{
        Object.entries(day).forEach(([id,v])=>{
            if(!total[id]) total[id]={net:0};
            total[id].net += v.net;
        });
    });

    rankingTotal.innerHTML="";

    let final = Object.entries(total).map(([id,v])=>{
        let p=players.find(x=>x.id==id);
        return {nom:p.prenom,net:v.net};
    });

    final.sort((a,b)=>a.net-b.net);

    final.forEach((f,i)=>{
        rankingTotal.innerHTML += `
        <li>🥇 #${i+1} ${f.nom} ${f.net.toFixed(1)}</li>`;
    });
}

// ✅ COUNTDOWN CORRIGÉ (PERSONNEL)
function updateClock(){

    const now = new Date();
    clock.innerText = now.toLocaleTimeString();

    let next = null;

    tees.forEach(t=>{
        if(t.player !== activeId) return;

        const [h,m]=t.heure.split(":");
        let d = new Date();
        d.setHours(h,m,0);

        if(d>now && (!next || d<next)) next = d;
    });

    if(!next){
        countdown.innerText="Aucun départ";
        return;
    }

    const diff = next-now;
    const min = Math.floor(diff/60000);
    const sec = Math.floor((diff%60000)/1000);

    countdown.innerText = `Départ dans ${min}m ${sec}s`;

    if(diff < 600000){
        clockCard.classList.add("alert");
    } else {
        clockCard.classList.remove("alert");
    }
}

// ✅ METEO FIX % PLUIE
function loadMeteo(){
fetch("https://api.open-meteo.com/v1/forecast?latitude=46.12&longitude=3.40&current_weather=true&hourly=precipitation_probability")
.then(r=>r.json())
.then(d=>{
    const temp = d.current_weather.temperature;
    const pluie = d.hourly.precipitation_probability[0]; // ✅ fix

    meteo.innerText = `${temp}°C | ☔ ${pluie}%`;
})
.catch(()=> meteo.innerText="indispo");
}

// INIT
renderPlayers();
renderPlanning();
renderRanking();
loadMeteo();

setInterval(updateClock,1000);

</script>
