<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Grande Semaine Golf Vichy</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    font-size: 20px;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: black;
    color: white;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏌️ Grande Semaine de Vichy</h1>

<div class="card">
    <h3>Créer un joueur</h3>
    <input type="text" id="prenom" placeholder="Prénom">
    <input type="text" id="nom" placeholder="Nom">
    <button onclick="ajouterJoueur()">Ajouter</button>
</div>

<div class="card">
    <h3>Liste des joueurs</h3>
    <ul id="listeJoueurs"></ul>
</div>

<div class="card">
    <h3>Saisie du score</h3>
    <select id="selectJoueur"></select>
    <input type="number" id="score" placeholder="Score net">
    <button onclick="ajouterScore()">Enregistrer</button>
</div>

<div class="card">
    <h3>Classement</h3>
    <ul id="classement"></ul>
</div>

</div>

<script>
let joueurs = [];
let scores = [];

function ajouterJoueur() {
    const prenom = document.getElementById("prenom").value;
    const nom = document.getElementById("nom").value;

    if (!prenom || !nom) return;

    joueurs.push({ prenom, nom });
    afficherJoueurs();
}

function afficherJoueurs() {
    const liste = document.getElementById("listeJoueurs");
    const select = document.getElementById("selectJoueur");

    liste.innerHTML = "";
    select.innerHTML = "";

    joueurs.forEach((j, index) => {
        liste.innerHTML += `<li>${j.prenom} ${j.nom}</li>`;
        select.innerHTML += `<option value="${index}">${j.prenom} ${j.nom}</option>`;
    });
}

function ajouterScore() {
    const joueurId = document.getElementById("selectJoueur").value;
    const score = document.getElementById("score").value;

    if (score === "") return;

    const joueur = joueurs[joueurId];

    scores.push({
        nom: joueur.prenom + " " + joueur.nom,
        score: parseInt(score)
    });

    afficherClassement();
}

function afficherClassement() {
    const classement = document.getElementById("classement");

    scores.sort((a, b) => a.score - b.score);

    classement.innerHTML = "";

    scores.forEach((s, index) => {
        classement.innerHTML += `<li>#${index + 1} - ${s.nom} : ${s.score}</li>`;
    });
}
</script>

</body>
</html>
