<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournoi Golf Vichy</title>

<style>
body {font-family:-apple-system;background:#f2f4f8;margin:0;padding:15px;}
.card{background:white;padding:15px;margin-bottom:10px;border-radius:12px;}
button{width:100%;padding:10px;margin-top:5px;background:black;color:white;border:none;}
.alert{background:#d1fae5;}
.soon{background:#fef3c7;}
</style>
</head>

<body>

<h2>🏆 Tournoi Golf</h2>

<div class="card">
<h3>🌤 Météo</h3>
<div id="meteo"></div>
</div>

<div class="card" id="clockCard">
<h3>⏰ Horloge</h3>
<div id="clock"></div>
<div id="countdown"></div>
</div>

<div class="card">
<h3>👤 Joueur</h3>
<select id="playerSelect"></select>
</div>

<div class="card">
<h3>⛳ Ajouter départ</h3>
<select id="day">
<option>Jour 1</option>
<option>Jour 2</option>
<option>Jour 3</option>
</select>
<input id="time" placeholder="09:10">
<button id="btnAddTee">Ajouter départ</button>
</div>

<div class="card">
<h3>📅 Planning</h3>
<ul id="planning"></ul>
</div>

<div class="card">
<h3>🎯 Score</h3>
<select id="dayScore">
<option>Jour 1</option>
<option>Jour 2</option>
<option>Jour 3</option>
</select>
<input id="score" type="number">
<button id="btnAddScore">Valider</button>
</div>

<div class="card">
<h3>🏆 Classement</h3>
<ul id="ranking"></ul>
</div>

<script>

// DOM
const el=id=>document.getElementById(id);

const playerSelect=el("playerSelect");
const planning=el("planning");
const ranking=el("ranking");
const clock=el("clock");
const countdown=el("countdown");
const clockCard=el("clockCard");
const meteo=el("meteo");

const time=el("time");
const day=el("day");
const dayScore=el("dayScore");
const score=el("score");

// DATA
let players=JSON.parse(localStorage.players||"[]");
let tees=JSON.parse(localStorage.tees||"[]");
let scores=JSON.parse(localStorage.scores||"{}");

let activeId=null;

// INIT joueurs (fix)
if(players.length===0){
players=[
{id:1,prenom:"Louis",pseudo:"Luigi",index:12},
{id:2,prenom:"Yoyo",pseudo:"Scalopina",index:10},
{id:3,prenom:"Guigui",pseudo:"Comono",index:15},
{id:4,prenom:"Marie",pseudo:"Pankake",index:18}
];
save();
}

// SAVE
function save(){
localStorage.players=JSON.stringify(players);
localStorage.tees=JSON.stringify(tees);
localStorage.scores=JSON.stringify(scores);
}

// JOUEURS
function renderPlayers(){
playerSelect.innerHTML="";
players.forEach(p=>{
playerSelect.innerHTML+=`<option value="${p.id}">
${p.prenom} (${p.pseudo})
</option>`;
});
activeId=players[0].id;
playerSelect.value=activeId;
}
playerSelect.onchange=()=>activeId=Number(playerSelect.value);

// DEPART
document.getElementById("btnAddTee").onclick=()=>{
if(!time.value.includes(":")) return alert("Heure format 09:10");

tees=tees.filter(t=>!(t.player===activeId && t.day===day.value));

tees.push({
day:day.value,
time:time.value,
player:activeId
});

time.value="";
save();
renderPlanning();
};

// PLANNING
function renderPlanning(){
planning.innerHTML="";
tees.sort((a,b)=>a.time.localeCompare(b.time));

tees.forEach(t=>{
let p=players.find(x=>x.id===t.player);
if(!p) return;

planning.innerHTML+=`
<li>${t.day} ${t.time} - ${p.prenom}</li>`;
});
}

// SCORE
document.getElementById("btnAddScore").onclick=()=>{
let p=players.find(x=>x.id==activeId);
if(!p||!score.value) return;

let brut=Number(score.value);
let net=brut-p.index;

if(!scores[dayScore.value]) scores[dayScore.value]={};

scores[dayScore.value][p.id]={brut,net};

score.value="";
save();
renderRanking();
};

// CLASSEMENT
function renderRanking(){

let total={};

Object.values(scores).forEach(day=>{
Object.entries(day).forEach(([id,v])=>{
if(!total[id]) total[id]={net:0};
total[id].net+=v.net;
});
});

ranking.innerHTML="";

let list=Object.entries(total).map(([id,v])=>{
let p=players.find(x=>x.id==id);
return {nom:p.prenom,net:v.net};
});

list.sort((a,b)=>a.net-b.net);

list.forEach((l,i)=>{
ranking.innerHTML+=`<li>#${i+1} ${l.nom} ${l.net.toFixed(1)}</li>`;
});
}

// HORLOGE
function updateClock(){
let now=new Date();
clock.innerText=now.toLocaleTimeString();

let next=null;

tees.forEach(t=>{
if(t.player!==activeId) return;

let [h,m]=t.time.split(":");
let d=new Date();
d.setHours(h,m,0);

if(d>now&&(!next||d<next)) next=d;
});

if(!next){
countdown.innerText="Aucun départ";
return;
}

let diff=next-now;
let min=Math.floor(diff/60000);
let sec=Math.floor((diff%60000)/1000);

countdown.innerText=`Départ dans ${min}m ${sec}s`;

if(diff<600000){
clockCard.classList.add("alert");
}else{
clockCard.classList.remove("alert");
}
}

// METEO
function loadMeteo(){
fetch("https://api.open-meteo.com/v1/forecast?latitude=46.12&longitude=3.40&current_weather=true&hourly=precipitation_probability")
.then(r=>r.json())
.then(d=>{
const pluie=d.hourly.precipitation_probability[0];
meteo.innerText=`${d.current_weather.temperature}°C | ☔ ${pluie}%`;
});
}

// INIT
renderPlayers();
renderPlanning();
renderRanking();
loadMeteo();

setInterval(updateClock,1000);

</script>

</body>
</html>
